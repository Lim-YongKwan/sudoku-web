<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>008 숫자 디자인 비교 · 개발 전용</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../styles/main.css">
  <script type="module" src="./typography-checks.js"></script>
</head>
<body>
  <main class="game-shell" aria-labelledby="page-title">
    <header class="page-header">
      <h1 id="page-title">부드러운형 숫자 비교</h1>
      <p class="intro">개발 전용 시각 검증입니다. <a href="/">실제 게임</a>으로 돌아가기</p>
    </header>
    <div class="fixture-controls">
      <button type="button" data-mode="playing">단서·입력·메모</button>
      <button type="button" data-mode="conflict">선택·충돌</button>
      <button type="button" data-mode="generating">생성 중</button>
      <button type="button" data-mode="completed">완료 잠금</button>
      <button type="button" id="measure">실측 검사</button>
    </div>
    <section class="board-card" aria-labelledby="board-title">
      <h2 id="board-title">1~9 고정·입력 숫자</h2>
      <p class="board-help" id="help">첫째 줄은 고정 단서, 둘째 줄은 입력 숫자입니다. 셋째 줄 첫 셀은 메모 1~9입니다. 비교용 배열이며 플레이 가능한 퍼즐이 아닙니다. 320px·1280px에서 3·6·8의 굵기, 정렬, 잘림과 Tab 포커스를 확인하세요.</p>
      <div id="typography-board" role="group" aria-label="숫자 디자인 비교 보드" aria-describedby="help"></div>
      <div class="number-pad" aria-label="숫자 패드 글꼴 비교"></div>
    </section>
    <pre id="report" class="fixture-report" role="status">준비 중</pre>
  </main>
</body>
</html>
